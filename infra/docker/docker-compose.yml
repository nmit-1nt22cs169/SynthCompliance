services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - SYNTH_DATA_DIR=/app/public/data
      - SYNTH_SEED_DIR=/app/data/seeds
      - USE_SELF_HOSTED=${USE_SELF_HOSTED:-false}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_BASE_URL=${NIM_BASE_URL:-http://nim:8000/v1}
      - NEMOTRON_MODEL=${NEMOTRON_MODEL:-nvidia/nemotron-3-super}
    volumes:
      - ../public/data:/app/public/data
      - ../data/seeds:/app/data/seeds

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - VITE_API_URL=
