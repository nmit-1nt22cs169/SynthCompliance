[project]
name = "synthcompliance-generators"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30",
  "synthcompliance-taxonomy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthcompliance_generators*"]
