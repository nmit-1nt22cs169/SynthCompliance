[project]
name = "synthcompliance-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "synthcompliance-taxonomy",
  "synthcompliance-validators",
  "synthcompliance-generators",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthcompliance_agents*"]
